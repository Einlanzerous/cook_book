name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node

  build-and-push:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build identity for /api/health (SERV-128) — see Dockerfile.
          #
          # This job only runs when release-please actually cut a release, so
          # unlike a tag-triggered publish workflow there is no main-build path
          # whose metadata version output would be the literal "latest".
          # `needs.release-please.outputs.version` is already BARE semver,
          # matching org.opencontainers.image.version character for character —
          # the agreement the delivery matrix depends on, since it compares the
          # observed string and the reported label with strict equality.
          build-args: |
            APP_VERSION=${{ needs.release-please.outputs.version }}
            GIT_SHA=${{ github.sha }}

      - name: Notify construct-server
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CONSTRUCT_DISPATCH_TOKEN }}
          repository: Einlanzerous/construct-server
          event-type: image-updated
          client-payload: '{"image": "cook-book", "version": "${{ needs.release-please.outputs.version }}"}'
